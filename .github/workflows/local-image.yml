name: Local image

# Builds only the amd64 standard image (incl. OpenVINO) of our integration branch
# local/v*: the latest Frigate release plus our not yet released fixes.
# Pushed as ghcr.io/<owner>/frigate:<branch-with-dashes> (moving) and :<branch>-<sha>.

on:
  workflow_dispatch:
  push:
    branches:
      - "local/v*"
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    if: github.repository != 'blakeblackshear/frigate'
    runs-on: ubuntu-22.04
    name: AMD64 local build
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up QEMU and Buildx
        id: setup
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch="${GITHUB_REF_NAME//\//-}"
          echo "moving=${repo}:${branch}" >> "$GITHUB_OUTPUT"
          echo "pinned=${repo}:${branch}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "cache=${repo}:cache-${branch}-amd64" >> "$GITHUB_OUTPUT"
      - name: Build and push amd64 standard build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/main/Dockerfile
          push: true
          platforms: linux/amd64
          target: frigate
          tags: |
            ${{ steps.tags.outputs.moving }}
            ${{ steps.tags.outputs.pinned }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max
